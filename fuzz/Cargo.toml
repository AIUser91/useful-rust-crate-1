[package]
name = "webhook-verify-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.webhook-verify]
path = ".."

# The SendGrid provider is part of the default fuzz surface: the ECDSA/SPKI
# parsing and fail-closed paths get constant coverage, and the feature flag
# keeps the `cfg` blocks in the target built both ways.
[features]
default = ["sendgrid"]
sendgrid = ["webhook-verify/sendgrid"]

[[bin]]
name = "parse_and_verify"
path = "fuzz_targets/parse_and_verify.rs"
test = false
doc = false
bench = false
