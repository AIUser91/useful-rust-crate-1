name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rust: stable
            toolchain: stable
          - rust: beta
            toolchain: beta
          - rust: msrv
            toolchain: "1.85"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-features -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  fuzz-build:
    name: Fuzz build (nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz -> target
      - run: cargo fuzz build
        working-directory: fuzz

  secret-leak-check:
    name: Secret-leak grep check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Disallow println!, dbg!, log::, tracing:: in src/
        run: |
          # Fail if any of these macros appear in src/ (potential secret leaks).
          # Exclude test modules and cfg(test) blocks by only matching top-level
          # and non-test lines. A simple grep is the first line of defense;
          # the Secret type's redacted Debug/Display impls are the primary guard.
          if rg -n '(println!|dbg!|log::|tracing::)' src/; then
            echo "::error::Found println!/dbg!/log::/tracing:: macros in src/ — remove them or gate behind #[cfg(test)]"
            exit 1
          fi
