[package]
name = "webhook-verify"
version = "0.1.0"
edition = "2024"
# First release with edition 2024 support; verified by the CI matrix.
rust-version = "1.85"
description = "One function to verify inbound webhook signatures from major providers"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AIUser91/useful-rust-crate-1"
readme = "README.md"
keywords = [
    "webhook",
    "webhooks",
    "verification",
    "signature",
    "hmac",
    "ed25519",
    "security",
]
categories = ["web-programming", "cryptography", "authentication"]
exclude = ["/fuzz"]

[dependencies]
actix-web = { version = "4", optional = true, default-features = false }
base64 = "0.23.1"
bytes = { version = "1.12.1", optional = true }
ed25519-dalek = "3.0.0"
hex = "0.4.3"
hmac = "0.13.0"
http = { version = "1.5.0", optional = true }
http-body = { version = "1.1.0", optional = true }
http-body-util = { version = "0.1.5", optional = true }
sha1 = "0.11.0"
sha2 = "0.11.0"
subtle = "2.6.1"
tower-layer = { version = "0.3.3", optional = true }
tower-service = { version = "0.3.3", optional = true }

[features]
default = ["std"]
# The core verification path is `no_std + alloc` compatible (spec.md §1).
# Building without this feature drops the wall-clock dependency: the
# injectable `Clock::now()` returns unix seconds directly and `VerifyError`
# does not implement `std::error::Error`. `SystemClock` is only available
# under `std` (there is no wall clock in the no_std ecosystem); callers on
# bare-metal/wasm targets supply their own `Clock` for timestamped
# (replay-protected) providers.
std = []
http = ["dep:http"]
# actix-web 4 adapter: extractor + header bridge (actix's internal `http`
# 0.2 types need their own impl of the crate's `HeaderMap` trait). Contains
# no verification logic of its own.
actix = ["dep:actix-web"]
# Generic `tower::Layer`/`Service` middleware (works with axum routers too).
# Enables the `http` *feature* (not just the dependency) so the
# `HeaderMap` impl for `http::HeaderMap` is compiled in.
tower = [
    "http",
    "dep:bytes",
    "dep:http-body",
    "dep:http-body-util",
    "dep:tower-layer",
    "dep:tower-service",
]

[dev-dependencies]
futures-executor = "0.3.34"
tower = { version = "0.5.3", features = ["util"] }
# Test-only: the `macros` feature provides `#[actix_web::test]`; the library
# dependency itself is default-feature-free, so this only widens test builds.
actix-web = { version = "4", features = ["macros"] }
